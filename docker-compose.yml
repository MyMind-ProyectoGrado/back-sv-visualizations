services:
  backend:
    container_name: back-sv-visualizations
    build: .
    ports:
      - "8002:8002"
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002"]
    volumes:
      - .:/app  

    networks:
      - shared-net 

networks:
  shared-net:
    name: shared-net  